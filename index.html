<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Envictica | Fiduciary Gateway</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #0d1117;
        color: #e6edf3;
        font-family: "Hanken Grotesk", sans-serif;
      }
      .hero-glow {
        background: radial-gradient(
          circle at 50% 50%,
          rgba(0, 245, 212, 0.05) 0%,
          transparent 70%
        );
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden hero-glow"
  >
    <div
      class="absolute inset-0 z-0 opacity-20"
      style="
        background-image: linear-gradient(#30363d 1px, transparent 1px),
          linear-gradient(90deg, #30363d 1px, transparent 1px);
        background-size: 40px 40px;
      "
    ></div>
    <main class="z-10 w-full max-w-4xl px-6 text-center">
      <div
        class="mb-12 inline-flex items-center gap-3 px-4 py-2 border border-[#00f5d4]/20 bg-[#00f5d4]/5 rounded-full"
      >
        <span class="w-2 h-2 rounded-full bg-[#00f5d4] animate-pulse"></span>
        <span
          class="text-[11px] font-bold tracking-[0.2em] text-[#00f5d4] uppercase"
        >
          System Live // Global Ingestion Active
        </span>
      </div>
      <h1
        class="text-6xl md:text-8xl font-extrabold tracking-tighter text-white mb-6"
      >
        ENVICTICA
      </h1>
      <p
        class="text-xl md:text-2xl text-slate-400 font-light max-w-2xl mx-auto mb-12 leading-relaxed"
      >
        Fiduciary Data Infrastructure & Risk Mitigation Governance for
        <span class="text-white border-b border-[#00f5d4]">
          Enterprise Legal AI
        </span>
        .
      </p>
      <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
        <a
          href="command-center.html"
          class="w-full md:w-auto px-8 py-4 bg-[#00f5d4] text-black font-bold rounded hover:bg-[#00d1b5] transition-all transform hover:scale-105 flex items-center justify-center gap-2"
        >
          ENTER COMMAND BRIDGE
        </a>
        <a
          href="board-roi.html"
          class="w-full md:w-auto px-8 py-4 border border-white/10 bg-white/5 text-white font-bold rounded hover:bg-white/10 transition-all flex items-center justify-center gap-2"
        >
          BOARDROOM SIMULATION
        </a>
      </div>
      <footer
        class="mt-24 pt-12 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-6 opacity-40"
      >
        <div class="text-[10px] uppercase tracking-[0.3em]">
          v4.02 // Fiduciary Infrastructure
        </div>
        <div class="text-[10px] uppercase tracking-[0.3em]">
          Secure Uplink: Established
        </div>
      </footer>
    </main>
  </body>
</html>
