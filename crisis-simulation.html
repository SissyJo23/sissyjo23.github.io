<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
    <title>Envictica: Live Crisis & 3D Neural Simulation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'primary': '#00F5D4', // Electric Teal
                        'env-alert': '#FF4D6D', // Burnt Crimson
                        'surface': '#0b1326',
                        'surface-container': '#131b2e',
                    },
                    fontFamily: {
                        'sans': ['Hanken Grotesk', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #060e20; color: #e3e1e9; overflow-x: hidden; }
        .minds-eye-container { position: relative; height: 350px; width: 100%; }
        .glass-card { background: rgba(19, 27, 46, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(0, 245, 212, 0.1); }
        .alert-active { border-color: #FF4D6D; box-shadow: 0 0 15px rgba(255, 77, 109, 0.2); }
        .verified-pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        .scanline { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: rgba(0, 245, 212, 0.1); animation: scan 4s linear infinite; pointer-events: none; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">
    <div class="scanline"></div>

    <!-- Header -->
    <header class="h-16 border-b border-white/5 flex items-center justify-between px-6 bg-surface/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary text-3xl">hub</span>
            <span class="font-black text-2xl tracking-tighter italic">ENVICTICA</span>
        </div>
        <div class="flex items-center gap-2">
            <div id="status-dot" class="w-2 h-2 rounded-full bg-primary verified-pulse"></div>
            <span id="status-text" class="text-[10px] font-mono tracking-widest uppercase text-primary">System Stable</span>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full flex flex-col gap-6">
        
        <!-- 3D Visualization Area -->
        <section class="glass-card rounded-xl overflow-hidden relative">
            <div class="absolute top-4 left-4 z-10 px-3 py-1 bg-black/40 border border-primary/20 rounded-full flex items-center gap-2">
                <span class="material-symbols-outlined text-primary text-sm">visibility</span>
                <span class="text-[10px] font-mono text-primary uppercase tracking-widest">Neural Ingestion Core</span>
            </div>
            
            <div id="threejs-container" class="minds-eye-container bg-black/20"></div>
            
            <div id="alert-banner" class="absolute inset-0 bg-env-alert/10 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-500">
                <div class="px-6 py-3 bg-env-alert text-white font-black text-sm tracking-[0.2em] uppercase rounded-sm shadow-2xl">
                    Autonomous Cascade Intercepted
                </div>
            </div>
        </section>

        <!-- Live Telemetry -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass-card p-5 rounded-lg border-l-4 border-primary">
                <p class="text-[10px] font-mono text-white/50 uppercase tracking-widest mb-1">Ingestion Velocity</p>
                <div class="flex items-baseline gap-2">
                    <span id="velocity-val" class="text-3xl font-extrabold text-white">12.4k</span>
                    <span class="text-[10px] text-white/40 font-mono">clauses/sec</span>
                </div>
            </div>
            <div id="drift-card" class="glass-card p-5 rounded-lg border-l-4 border-primary transition-colors">
                <p class="text-[10px] font-mono text-white/50 uppercase tracking-widest mb-1">Model Drift</p>
                <div class="flex items-center justify-between">
                    <span id="drift-val" class="text-3xl font-extrabold text-primary transition-colors">0.04</span>
                    <span id="drift-status" class="px-2 py-0.5 bg-primary/10 border border-primary/20 text-primary text-[9px] font-mono rounded">NOMINAL</span>
                </div>
            </div>
            <div class="glass-card p-5 rounded-lg border-l-4 border-primary">
                <p class="text-[10px] font-mono text-white/50 uppercase tracking-widest mb-1">Liability Avoided</p>
                <div class="flex items-baseline gap-1">
                    <span class="text-3xl font-extrabold text-white">$</span>
                    <span id="liability-val" class="text-3xl font-extrabold text-white">0.00</span>
                </div>
            </div>
        </section>

        <!-- Control Deck -->
        <section class="mt-auto grid grid-cols-2 gap-4 pb-8">
            <button onclick="triggerCrisis('hallucination')" class="group relative overflow-hidden p-6 glass-card rounded-xl border border-white/5 hover:border-env-alert transition-all text-left">
                <span class="material-symbols-outlined text-white/30 group-hover:text-env-alert mb-2 transition-colors">psychology_alt</span>
                <p class="text-[10px] font-mono text-white/40 uppercase tracking-tighter mb-1">Protocol 17</p>
                <p class="text-xs font-black tracking-widest group-hover:text-env-alert transition-colors">TRIGGER HALLUCINATION</p>
            </button>
            <button onclick="triggerCrisis('blackout')" class="group relative overflow-hidden p-6 glass-card rounded-xl border border-white/5 hover:border-env-alert transition-all text-left">
                <span class="material-symbols-outlined text-white/30 group-hover:text-env-alert mb-2 transition-colors">cloud_off</span>
                <p class="text-[10px] font-mono text-white/40 uppercase tracking-tighter mb-1">Resilience Suite</p>
                <p class="text-xs font-black tracking-widest group-hover:text-env-alert transition-colors">SIMULATE BLACKOUT</p>
            </button>
        </section>
    </main>

    <footer class="p-4 border-t border-white/5 flex justify-center opacity-40">
        <p class="text-[9px] font-mono tracking-[0.3em] uppercase">Fiduciary Command // Envictica Portal V2.4</p>
    </footer>

    <script>
        // --- 3D ENGINE ---
        let scene, camera, renderer, eyeGroup, core, outerRing, midRing, innerRing, light;
        const tealColor = 0x00F5D4;
        const crimsonColor = 0xFF4D6D;

        function initThree() {
            const container = document.getElementById('threejs-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const material = new THREE.MeshPhongMaterial({
                color: tealColor,
                emissive: tealColor,
                emissiveIntensity: 1.5,
                transparent: true,
                opacity: 0.9,
                wireframe: true
            });

            eyeGroup = new THREE.Group();
            outerRing = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.02, 16, 100), material);
            midRing = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.05, 16, 100), material);
            innerRing = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.08, 16, 100), material);
            core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.6, 2), material);

            eyeGroup.add(outerRing, midRing, innerRing, core);
            scene.add(eyeGroup);

            light = new THREE.PointLight(tealColor, 2, 50);
            light.position.set(5, 5, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.3));

            camera.position.z = 6;
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            eyeGroup.rotation.y += 0.01 * (window.isCrisis ? 5 : 1);
            eyeGroup.rotation.x += 0.005;
            outerRing.rotation.z -= 0.02;
            midRing.rotation.z += 0.03;
            const pulse = 1 + Math.sin(Date.now() * 0.003) * 0.15;
            core.scale.setScalar(pulse);
            renderer.render(scene, camera);
        }

        // --- SIMULATION LOGIC ---
        window.isCrisis = false;
        let liabilityTotal = 0;

        function triggerCrisis(type) {
            if (window.isCrisis) return;
            window.isCrisis = true;
            
            // Visual Update to Crisis
            updateUIState('CRISIS');
            
            if (type === 'hallucination') {
                simulateClimb();
            } else {
                simulateBlackout();
            }

            // Self-healing timeout
            setTimeout(() => {
                updateUIState('HEALING');
                setTimeout(() => {
                    updateUIState('STABLE');
                    window.isCrisis = false;
                }, 3000);
            }, 5000);
        }

        function updateUIState(state) {
            const elements = {
                statusDot: document.getElementById('status-dot'),
                statusText: document.getElementById('status-text'),
                driftVal: document.getElementById('drift-val'),
                driftStatus: document.getElementById('drift-status'),
                driftCard: document.getElementById('drift-card'),
                banner: document.getElementById('alert-banner'),
                material: core.material
            };

            if (state === 'CRISIS') {
                elements.statusDot.className = 'w-2 h-2 rounded-full bg-env-alert verified-pulse';
                elements.statusText.innerText = 'Anomaly Detected';
                elements.statusText.className = 'text-[10px] font-mono tracking-widest uppercase text-env-alert';
                elements.driftVal.innerText = '0.84';
                elements.driftVal.className = 'text-3xl font-extrabold text-env-alert transition-colors';
                elements.driftStatus.innerText = 'CRITICAL';
                elements.driftStatus.className = 'px-2 py-0.5 bg-env-alert/10 border border-env-alert/20 text-env-alert text-[9px] font-mono rounded';
                elements.driftCard.className = 'glass-card p-5 rounded-lg border-l-4 border-env-alert transition-colors';
                elements.banner.style.opacity = '1';
                elements.material.color.setHex(crimsonColor);
                elements.material.emissive.setHex(crimsonColor);
                light.color.setHex(crimsonColor);
            } else if (state === 'HEALING') {
                elements.statusText.innerText = 'Self-Healing Protocol...';
                elements.statusText.className = 'text-[10px] font-mono tracking-widest uppercase text-primary animate-pulse';
                elements.banner.style.opacity = '0';
            } else {
                elements.statusDot.className = 'w-2 h-2 rounded-full bg-primary verified-pulse';
                elements.statusText.innerText = 'System Stable';
                elements.statusText.className = 'text-[10px] font-mono tracking-widest uppercase text-primary';
                elements.driftVal.innerText = '0.04';
                elements.driftVal.className = 'text-3xl font-extrabold text-primary transition-colors';
                elements.driftStatus.innerText = 'NOMINAL';
                elements.driftStatus.className = 'px-2 py-0.5 bg-primary/10 border border-primary/20 text-primary text-[9px] font-mono rounded';
                elements.driftCard.className = 'glass-card p-5 rounded-lg border-l-4 border-primary transition-colors';
                elements.material.color.setHex(tealColor);
                elements.material.emissive.setHex(tealColor);
                light.color.setHex(tealColor);
            }
        }

        function simulateClimb() {
            let start = parseFloat(document.getElementById('liability-val').innerText.replace('M', ''));
            const target = start + 4.2;
            const interval = setInterval(() => {
                start += 0.1;
                document.getElementById('liability-val').innerText = start.toFixed(2) + 'M';
                if (start >= target) clearInterval(interval);
            }, 50);
        }

        function simulateBlackout() {
            const v = document.getElementById('velocity-val');
            v.innerText = '0.00';
            v.classList.add('text-env-alert');
            setTimeout(() => {
                v.innerText = '4.2k';
                v.classList.remove('text-env-alert');
                v.classList.add('text-primary');
                document.getElementById('status-text').innerText = 'Failover Active: Node Llama-3';
            }, 800);
        }

        window.onload = initThree;
        window.addEventListener('resize', () => {
            const container = document.getElementById('threejs-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
