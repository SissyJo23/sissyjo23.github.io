<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Envictica | Mobile Command</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#00F5D4",
              "env-alert": "#FF4D6D",
              surface: "#0A0B0E",
              "surface-container": "#13151B",
              outline: "#2A2E39",
              "on-surface-variant": "#9CA3AF",
            },
            fontFamily: {
              display: ["Sora", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
              body: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #050608;
        color: #e3e1e9;
      }
      .glass-card {
        background: rgba(19, 21, 27, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .status-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body class="font-body antialiased min-h-screen pb-24">
    <header class="px-6 pt-6 pb-6 flex justify-between items-end">
      <div class="flex flex-col gap-1">
        <span
          class="font-display text-2xl font-black italic tracking-tighter text-white leading-none"
        >
          ENVICTICA
        </span>
        <span
          class="font-mono text-[10px] text-primary tracking-widest uppercase"
        >
          Infrastructure Mobile
        </span>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-primary status-pulse"></div>
        <span class="font-mono text-[10px] text-primary uppercase">
          Live
        </span>
      </div>
    </header>
    <main class="px-6 flex flex-col gap-6">
      <section class="glass-card p-5 rounded-sm">
        <span
          class="font-mono text-[10px] text-on-surface-variant uppercase tracking-widest block mb-4"
        >
          System Health
        </span>
        <div class="flex justify-between items-baseline">
          <span class="font-mono text-4xl text-white font-light">
            99.999%
          </span>
          <span class="font-mono text-[10px] text-primary uppercase">
            Fiduciary Grade
          </span>
        </div>
      </section>
      <section class="glass-card p-5 rounded-sm">
        <div class="flex justify-between items-center mb-4">
          <span
            class="font-mono text-[10px] text-on-surface-variant uppercase tracking-widest"
          >
            Global Ingestion
          </span>
          <span class="material-symbols-outlined text-primary text-sm">
            trending_up
          </span>
        </div>
        <div class="font-mono text-2xl text-white mb-1">
          12.4k
          <span class="text-xs text-on-surface-variant">
            Clauses/Sec
          </span>
        </div>
        <div
          class="w-full h-1 bg-surface-container rounded-full overflow-hidden"
        >
          <div class="w-3/4 h-full bg-primary"></div>
        </div>
      </section>
      <section class="flex flex-col gap-4">
        <span
          class="font-mono text-[10px] text-on-surface-variant uppercase tracking-widest"
        >
          Critical Intercepts
        </span>
        <div
          class="glass-card p-4 rounded-sm border-l-2 border-env-alert flex items-start gap-4"
        >
          <span class="material-symbols-outlined text-env-alert">
            gpp_maybe
          </span>
          <div class="flex flex-col gap-1">
            <span class="font-mono text-[11px] text-white font-bold">
              Autonomous Cascade Intercepted
            </span>
            <span class="text-[10px] text-on-surface-variant">
              1,400 unverified clauses blocked from Procurement database.
            </span>
          </div>
        </div>
      </section>
      <div class="grid grid-cols-2 gap-4 mt-2">
        <button
          type="button"
          class="bg-surface-container border border-outline py-4 rounded-sm flex flex-col items-center gap-2"
        >
          <span class="material-symbols-outlined text-primary">
            analytics
          </span>
          <span class="font-mono text-[9px] uppercase tracking-widest">
            Reports
          </span>
        </button>
        <button
          type="button"
          class="bg-env-alert/10 border border-env-alert/20 py-4 rounded-sm flex flex-col items-center gap-2"
        >
          <span class="material-symbols-outlined text-env-alert">
            bolt
          </span>
          <span
            class="font-mono text-[9px] uppercase tracking-widest text-env-alert"
          >
            Kill Switch
          </span>
        </button>
      </div>
    </main>
    <nav
      class="fixed bottom-0 left-0 w-full bg-surface-container border-t border-outline flex justify-around items-center h-20 px-4 z-50"
      aria-label="Primary navigation"
    >
      <button
        type="button"
        aria-label="Command Center"
        class="material-symbols-outlined text-primary"
      >
        dashboard
      </button>
      <button
        type="button"
        aria-label="Infrastructure"
        class="material-symbols-outlined text-on-surface-variant"
      >
        lan
      </button>
      <button
        type="button"
        aria-label="Governance"
        class="material-symbols-outlined text-on-surface-variant"
      >
        gavel
      </button>
      <button
        type="button"
        aria-label="History"
        class="material-symbols-outlined text-on-surface-variant"
      >
        history
      </button>
    </nav>
    <script src="envictica-ui.js"></script>
  </body>
</html>
