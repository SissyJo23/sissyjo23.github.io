name: Envictica Regression CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate Project Files
        run: |
          echo "Listing workspace root:"
          ls -la
          echo "Checking nested directory if present:"
          ls -la sissyjo23.github.io || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Node Dependencies
        run: |
          if [ -d "sissyjo23.github.io" ]; then
            cd sissyjo23.github.io && npm install
          else
            npm install
          fi

      - name: Start Envictica Server in Background
        run: |
          if [ -d "sissyjo23.github.io" ]; then
            cd sissyjo23.github.io
            nohup node server.js > server.log 2>&1 &
          else
            nohup node server.js > server.log 2>&1 &
          fi
          sleep 3

      - name: Run Generalization Benchmark
        env:
          PORT: 3000
        run: |
          if [ -d "sissyjo23.github.io" ]; then
            cd sissyjo23.github.io
            python3 run_generalization.py
          else
            python3 run_generalization.py
          fi
