name: Envictica Regression CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Locate Files and Run Benchmark
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== DIRECTORY CONTENTS ==="
          ls -la
          
          echo "=== INSTALLING NPM ==="
          npm install
          
          echo "=== STARTING SERVER ==="
          nohup node server.js > server.log 2>&1 &
          sleep 3
          
          echo "=== RUNNING BENCHMARK ==="
          if [ -f "run_generalization.py" ]; then
            PORT=3000 python3 run_generalization.py
          elif [ -f "../run_generalization.py" ]; then
            PORT=3000 python3 ../run_generalization.py
          elif [ -f "sissyjo23.github.io/run_generalization.py" ]; then
            PORT=3000 python3 sissyjo23.github.io/run_generalization.py
          else
            python3 ../sissyjo23.github.io/run_generalization.py
          fi
