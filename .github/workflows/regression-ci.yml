name: Envictica Regression CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Node Dependencies
        run: |
          cd sissyjo23.github.io || true
          npm install

      - name: Start Envictica Server in Background
        run: |
          cd sissyjo23.github.io || true
          nohup node server.js > server.log 2>&1 &
          sleep 3

      - name: Run Generalization Benchmark
        env:
          PORT: 3000
        run: |
          cd sissyjo23.github.io || true
          python3 run_generalization.py
