name: Envictica Regression CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Generalization Benchmark
        env:
          PORT: 3000
        run: |
          # Start local server instance if needed for testing, or run against target endpoint
          python3 run_generalization.py
