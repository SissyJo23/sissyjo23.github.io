      - name: Install Dependencies and Run Benchmark
        run: |
          npm install
          nohup node server.js > server.log 2>&1 &
          sleep 3
          # Explicitly locate the script file with fallback paths
          if [ -f "run_generalization.py" ]; then
            PYTHON_SCRIPT="run_generalization.py"
          elif [ -f "sissyjo23.github.io/run_generalization.py" ]; then
            PYTHON_SCRIPT="sissyjo23.github.io/run_generalization.py"
          else
            PYTHON_SCRIPT=$(find . -name "run_generalization.py" | head -n 1)
          fi
          
          echo "Executing script at: $PYTHON_SCRIPT"
          PORT=3000 python3 "$PYTHON_SCRIPT"
