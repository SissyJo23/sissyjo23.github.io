      - name: Install Dependencies and Run Benchmark
        run: |
          npm install
          nohup node server.js > server.log 2>&1 &
          sleep 3
          # Find and execute run_generalization.py wherever it resides
          PYTHON_SCRIPT=$(find . -name "run_generalization.py" | head -n 1)
          echo "Executing script at: $PYTHON_SCRIPT"
          PORT=3000 python3 "$PYTHON_SCRIPT"
