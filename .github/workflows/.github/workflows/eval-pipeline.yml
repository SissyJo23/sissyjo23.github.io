name: Envictica Evaluation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Regression & Holdout Benchmark
        env:
          API_BASE_URL: ${{ secrets.PRODUCTION_API_URL }}
          DB_CONNECTION_STRING: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python3 run_benchmark.py --suite envictica-eval-v1.3 --verify-db
          python3 run_benchmark.py --suite envictica-eval-v1.3-holdout --verify-db
