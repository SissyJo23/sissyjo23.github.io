name: Envictica Evaluation CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  run-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate Required Secrets
        env:
          API_BASE_URL: ${{ secrets.PRODUCTION_API_URL }}
          DB_CONNECTION_STRING: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$API_BASE_URL" || {
            echo "ERROR: PRODUCTION_API_URL is not configured."
            exit 1
          }

          test -n "$DB_CONNECTION_STRING" || {
            echo "ERROR: NEON_DATABASE_URL is not configured."
            exit 1
          }

      - name: Run Regression Benchmark
        env:
          API_BASE_URL: ${{ secrets.PRODUCTION_API_URL }}
          DB_CONNECTION_STRING: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python3 run_benchmark.py \
            --suite envictica-eval-v1.3 \
            --verify-db

      - name: Run Holdout Benchmark
        env:
          API_BASE_URL: ${{ secrets.PRODUCTION_API_URL }}
          DB_CONNECTION_STRING: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python3 run_benchmark.py \
            --suite envictica-eval-v1.3-holdout \
            --verify-db
